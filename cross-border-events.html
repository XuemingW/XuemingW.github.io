<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深广跨境电商活动每日更新</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #172033;
            background: #eef1f7;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1120px;
            margin: 0 auto;
            background: white;
            border-radius: 22px;
            box-shadow: 0 5px 18px rgba(35, 44, 73, 0.07);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4058df 0%, #7645bf 58%, #b34b8b 100%);
            color: white;
            padding: 40px;
            text-align: left;
        }
        
        .header h1 {
            font-size: 34px;
            line-height: 1.2;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .update-time {
            background: #f8f9fa;
            padding: 15px 40px;
            border-bottom: 2px solid #e9ecef;
            color: #666;
            font-size: 0.9em;
        }
        
        .events-container {
            padding: 40px;
        }
        
        .city-section {
            margin-bottom: 35px;
        }
        
        .city-section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid #e9ecef;
        }
        
        .city-section-title .city-flag {
            font-size: 2em;
        }
        
        .city-section-title .city-name {
            font-size: 1.6em;
            font-weight: 700;
            color: #333;
        }
        
        .city-section-title .city-count {
            background: #667eea;
            color: white;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 500;
        }
        
        .city-section-title.shenzhen .city-name {
            color: #667eea;
        }
        
        .city-section-title.shenzhen {
            border-bottom-color: #667eea;
        }
        
        .city-section-title.shenzhen .city-count {
            background: #667eea;
        }
        
        .city-section-title.guangzhou .city-name {
            color: #764ba2;
        }
        
        .city-section-title.guangzhou {
            border-bottom-color: #764ba2;
        }
        
        .city-section-title.guangzhou .city-count {
            background: #764ba2;
        }
        
        .event-card {
            background: white;
            border: 1px solid #e6eaf2;
            border-radius: 15px;
            padding: 21px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(31, 43, 74, 0.05);
            position: relative;
        }
        
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        
        .event-card .city-tag {
            position: absolute;
            top: -10px;
            right: 20px;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            color: white;
        }
        
        .city-tag.shenzhen-tag {
            background: linear-gradient(135deg, #667eea, #4f5bd5);
        }
        
        .city-tag.guangzhou-tag {
            background: linear-gradient(135deg, #764ba2, #9b59b6);
        }
        
        .event-title {
            font-size: 17px;
            color: #172033;
            margin-bottom: 15px;
            font-weight: 600;
            padding-right: 80px;
        }
        
        .event-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .info-icon {
            color: #667eea;
            font-size: 1.2em;
            min-width: 24px;
        }
        
        .info-content {
            flex: 1;
        }
        
        .info-label {
            font-weight: 600;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 2px;
        }
        
        .info-value {
            color: #333;
            font-size: 1em;
        }
        
        .event-highlights {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 5px;
            margin-top: 15px;
        }
        
        .event-highlights h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .event-highlights ul {
            list-style: none;
            padding-left: 0;
        }
        
        .event-highlights li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
        }
        
        .event-highlights li:before {
            content: "\25B8";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }
        
        .registration-info {
            background: linear-gradient(135deg, #4f63e9 0%, #7d48c9 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .registration-info h4 {
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .registration-info a {
            color: white;
            text-decoration: underline;
        }
        
        .no-events {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .no-events-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .footer {
            background: #f8f9fa;
            padding: 30px;
            text-align: center;
            color: #666;
            border-top: 2px solid #e9ecef;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .events-container {
                padding: 20px;
            }
            
            .event-card {
                padding: 20px;
            }
            
            .event-card .city-tag {
                position: static;
                display: inline-block;
                margin-bottom: 10px;
            }
            
            .event-title {
                padding-right: 0;
            }
        }

        body.embedded {
            padding-top: 10px;
        }

        body.embedded .container {
            max-width: 1120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">🚀 深广 AI × 跨境电商活动指南</h1>
            <p>未来一个月线下及线上活动｜深圳优先｜面向 OPC 跨境创业者</p>
        </div>
        
        <div class="update-time">
            <strong>更新时间：</strong><span id="updateTime">加载中...</span>
            <span style="float: right;">共 <strong id="eventCount">0</strong> 个活动</span>
        </div>
        
        <div class="events-container" id="eventsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>正在加载活动信息...</p>
            </div>
        </div>
        
        <div class="footer">
            <p>📡 数据来源：主办方官网、协会/园区官方渠道及主流活动平台；只收录已核验的线下与线上活动</p>
            <p>🔄 每日 08:00 自动更新 | 最后更新：<span id="lastUpdate">-</span></p>
            <p>⚠️ 活动时间、地点与报名状态可能临时调整，请以主办方最新通知为准</p>
        </div>
    </div>

    <script>
        // DAILY_EVENTS_START — 每日自动任务只更新这个数据对象。
        const currentEvents = {
    "update_time": "2026-10-30T08:05:00+08:00",
    "range_label": "2026年10月30日—11月30日",
    "cities": {
        "shenzhen": {
            "name": "深圳市",
            "flag": "🏙️",
            "events": [
                {
                    "title": "BrandTech 2026 全球品牌创新峰会",
                    "date": "2026年11月24日；具体时段待主办方公布",
                    "location": "深圳会展中心（福田）7号馆",
                    "highlights": [
                        "主办方聚集中国品牌、全球零售商、平台与商业合作伙伴，适合跨境增长工具和 AI 营销产品寻找潜在客户",
                        "可对接赞助或展位资源；商业合作和潜在订单均需自行洽谈"
                    ],
                    "registration": "主办方官网有活动登记入口；票价、截止时间及余票未公布，提交前核对主办方跳转页面。",
                    "source_url": "https://www.brandtechevents.com/",
                    "priority": false
                }
            ]
        },
        "guangzhou": {
            "name": "广州市",
            "flag": "🏙️",
            "events": [
                {
                    "title": "第140届广交会｜第三期产业对接",
                    "date": "第三期10月31日—11月4日",
                    "location": "广州中国进出口商品交易会展馆；亦可使用官方线上贸易配对",
                    "highlights": [
                        "广交会官方确认第三期日程；适合 AI 硬件、供应链工具与跨境卖家调研供应商",
                        "深圳 OPC 可先通过官网找产品、发布采购需求，再决定线下参加；现场对接不承诺融资或订单",
                        "第三期可关注健康、玩具与时尚消费品；可先在线匹配供应商，境内办证须走专用系统。"
                    ],
                    "registration": "官方采购商指南与境内办证系统入口可访问；境内采购商需最新邀请码、审核通过并成功办理证件，线上账号不等于线下入场资格。费用和本届办理截止未核实，个人不能默认入场。",
                    "source_url": "https://www.cantonfair.org.cn/buyerguide",
                    "priority": false
                },
                {
                    "title": "第十一届智造数字科技大会暨 AI 大会",
                    "date": "2026年11月20日 09:00—18:00",
                    "location": "广州；具体会场待主办方确认",
                    "highlights": [
                        "主题为智造＋AI、出海赢未来，议程含 AI 智能体与海外供应链、跨境数据合规及本地化增长",
                        "适合面向制造业和出海企业的 AI 产品团队交流落地场景；参会对象主要为企业负责人及数字化、海外业务负责人"
                    ],
                    "registration": "主办方开放提前注册，不接受现场报名；甲方企业报名须审核，厂商人员须缴费，金额与报名截止未公布。",
                    "source_url": "https://itknowledgezone.com/cn/event/11th-smart-manufacturing-digital-technology-conference/",
                    "priority": false
                },
                {
                    "title": "GDG Guangzhou｜2026 DevFest AI Carnival · Google Cloud 出海分论坛",
                    "date": "2026年11月21日 09:00—18:00；出海分论坛预计下午举行",
                    "location": "广州；具体会场待主办方公布",
                    "highlights": [
                        "官方议程设 Google Cloud Global Expansion Track，讨论云服务支持企业全球化",
                        "适合 AI 出海工具、开发者平台和跨境 SaaS 团队展示 Demo 并连接大湾区开发者"
                    ],
                    "registration": "GDG Guangzhou 官方活动页开放 RSVP，社区主页标注免费报名；截止、余位及具体会场未公布，项目展示须另联系组织者。",
                    "source_url": "https://gdg.community.dev/events/details/google-gdg-guangzhou-presents-2026-google-devfest-guangzhou-ai-carnival/",
                    "priority": false
                }
            ]
        },
        "online": {
            "name": "线上｜AI 出海与增长",
            "flag": "🌐",
            "events": []
        }
    }
};
        // DAILY_EVENTS_END

        function displayCurrentEvents(data) {
            const container = document.getElementById('eventsContainer');
            const updateDate = new Date(data.update_time);
            document.getElementById('updateTime').textContent = `${data.update_time.slice(0,16).replace('T',' ') + '（Asia/Shanghai）'}｜覆盖 ${data.range_label}`;
            document.getElementById('lastUpdate').textContent = data.update_time.slice(0,16).replace('T',' ') + '（Asia/Shanghai）';
            document.title = `深广 AI × 跨境电商活动指南（${data.range_label}）`;

            let total = 0;
            let html = '';
            for (const cityKey of ['shenzhen', 'guangzhou', 'online']) {
                const city = data.cities[cityKey];
                if (!city || !city.events.length) continue;
                const color = cityKey === 'shenzhen' ? 'shenzhen' : 'guangzhou';
                const tagClass = `${color}-tag`;
                html += `<div class="city-section"><div class="city-section-title ${color}"><span class="city-flag">${city.flag}</span><span class="city-name">${city.name}</span><span class="city-count">${city.events.length}场活动</span></div>`;
                for (const event of city.events) {
                    total++;
                    const badge = event.priority ? '<span style="background:#ff6b6b;color:white;padding:2px 8px;border-radius:8px;font-size:0.7em;margin-left:8px;">优先关注</span>' : '';
                    html += `<div class="event-card"><span class="city-tag ${tagClass}">📍 ${cityKey === 'shenzhen' ? '深圳' : cityKey === 'guangzhou' ? '广州' : '线上'}</span><div class="event-title">${event.title}${badge}</div><div class="event-info"><div class="info-item"><span class="info-icon">📅</span><div class="info-content"><div class="info-label">活动时间</div><div class="info-value">${event.date}</div></div></div><div class="info-item"><span class="info-icon">📍</span><div class="info-content"><div class="info-label">活动地点</div><div class="info-value">${event.location}</div></div></div></div><div class="event-highlights"><h4>💡 活动亮点</h4><ul>${event.highlights.map(item => `<li>${item}</li>`).join('')}</ul></div><div class="registration-info"><h4>🎫 报名方式</h4><p>${event.registration}</p><p style="margin-top:10px;"><a href="${event.source_url}" target="_blank" rel="noopener noreferrer">查看详情与报名 →</a></p></div></div>`;
                }
                html += '</div>';
            }
            if (!total) {
                html = '<div class="no-events"><div class="no-events-icon">📅</div><h3>暂未发现可靠活动</h3><p>未来一个月内暂未核验到深圳或广州的高相关线下活动。</p></div>';
            }
            document.getElementById('eventCount').textContent = total;
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (new URLSearchParams(location.search).has('embedded')) document.body.classList.add('embedded');
            displayCurrentEvents(currentEvents);
        });
    </script>
</body>
</html>
