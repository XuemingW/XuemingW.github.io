                    const cityData = data.cities[cityKey];
                    if (!cityData || !cityData.events || cityData.events.length === 0) continue;
                    
                    const cityColor = cityKey === 'shenzhen' ? 'shenzhen' : 'guangzhou';
                    
                    html += `
                        <div class="city-section">
                            <div class="city-section-title ${cityColor}">
                                <span class="city-flag">${cityData.flag}</span>
                                <span class="city-name">${cityData.name}</span>
                                <span class="city-count">${cityData.events.length}场活动</span>
                            </div>
                    `;
                    
                    for (const event of cityData.events) {
                        const tagClass = cityKey === 'shenzhen' ? 'shenzhen-tag' : 'guangzhou-tag';
                        const tagLabel = cityKey === 'shenzhen' ? '深圳' : '广州';
                        const upcomingBadge = event.is_upcoming ? '<span style="background:#ff6b6b;color:white;padding:2px 8px;border-radius:8px;font-size:0.7em;margin-left:8px;">本周</span>' : '';
                        
                        html += `
                            <div class="event-card">
                                <span class="city-tag ${tagClass}">📍 ${tagLabel}</span>
                                <div class="event-title">${event.title}${upcomingBadge}</div>
                                <div class="event-info">
                                    <div class="info-item">
                                        <span class="info-icon">📅</span>
                                        <div class="info-content">
                                            <div class="info-label">活动时间</div>
                                            <div class="info-value">${event.date}</div>
                                        </div>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-icon">📍</span>
                                        <div class="info-content">
                                            <div class="info-label">活动地点</div>
                                            <div class="info-value">${event.location}</div>
                                        </div>
                                    </div>
                                </div>
                                ${event.highlights && event.highlights.length > 0 ? `
                                    <div class="event-highlights">
                                        <h4>💡 活动亮点</h4>
                                        <ul>
                                            ${event.highlights.map(h => `<li>${h}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                                ${event.registration ? `
                                    <div class="registration-info">
                                        <h4>🎫 报名方式</h4>
                                        <p>${event.registration}</p>
                                        ${event.source_url ? `<p style="margin-top: 10px;"><a href="${event.source_url}" target="_blank">查看详情 →</a></p>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                        totalEvents++;
                    }
                    
                    html += '</div>';
                }
                
                eventCount.textContent = totalEvents;
            } else if (data.events) {
                totalEvents = data.events.length;
                if (totalEvents === 0) {
                    html = `
                        <div class="no-events">
                            <div class="no-events-icon">📅</div>
                            <h3>暂无活动信息</h3>
                            <p>最近一周内没有找到深圳/广州地区的跨境电商活动</p>
                        </div>
                    `;
                } else {
                    html = data.events.map(event => `
                        <div class="event-card">
                            <div class="event-title">${event.title}</div>
                            <div class="event-info">
                                <div class="info-item">
                                    <span class="info-icon">📅</span>
                                    <div class="info-content">
                                        <div class="info-label">活动时间</div>
                                        <div class="info-value">${event.date}</div>
                                    </div>
                                </div>
                                <div class="info-item">
                                    <span class="info-icon">📍</span>
                                    <div class="info-content">
                                        <div class="info-label">活动地点</div>
                                        <div class="info-value">${event.location}</div>
                                    </div>
                                </div>
                            </div>
                            ${event.highlights ? `
                                <div class="event-highlights">
                                    <h4>💡 活动亮点</h4>
                                    <ul>${event.highlights.map(h => `<li>${h}</li>`).join('')}</ul>
                                </div>
                            ` : ''}
                            ${event.registration ? `
                                <div class="registration-info">
                                    <h4>🎫 报名方式</h4>
                                    <p>${event.registration}</p>
                                    ${event.source_url ? `<p style="margin-top:10px;"><a href="${event.source_url}" target="_blank">查看详情 →</a></p>` : ''}
                                </div>
                            ` : ''}
                        </div>
                    `).join('');
                }
                eventCount.textContent = totalEvents;
            } else {
                html = `
                    <div class="no-events">
                        <div class="no-events-icon">📅</div>
                        <h3>暂无活动信息</h3>
                        <p>最近一周内没有找到深圳/广州地区的跨境电商活动</p>
                    </div>
                `;
                eventCount.textContent = '0';
            }
            
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadEvents);
    </script>
</body>
</html>
