<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深广跨境电商活动每日更新</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #172033;
            background: #eef1f7;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1120px;
            margin: 0 auto;
            background: white;
            border-radius: 22px;
            box-shadow: 0 5px 18px rgba(35, 44, 73, 0.07);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4058df 0%, #7645bf 58%, #b34b8b 100%);
            color: white;
            padding: 40px;
            text-align: left;
        }
        
        .header h1 {
            font-size: 34px;
            line-height: 1.2;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .update-time {
            background: #f8f9fa;
            padding: 15px 40px;
            border-bottom: 2px solid #e9ecef;
            color: #666;
            font-size: 0.9em;
        }
        
        .events-container {
            padding: 40px;
        }
        
        .city-section {
            margin-bottom: 35px;
        }
        
        .city-section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid #e9ecef;
        }
        
        .city-section-title .city-flag {
            font-size: 2em;
        }
        
        .city-section-title .city-name {
            font-size: 1.6em;
            font-weight: 700;
            color: #333;
        }
        
        .city-section-title .city-count {
            background: #667eea;
            color: white;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 500;
        }
        
        .city-section-title.shenzhen .city-name {
            color: #667eea;
        }
        
        .city-section-title.shenzhen {
            border-bottom-color: #667eea;
        }
        
        .city-section-title.shenzhen .city-count {
            background: #667eea;
        }
        
        .city-section-title.guangzhou .city-name {
            color: #764ba2;
        }
        
        .city-section-title.guangzhou {
            border-bottom-color: #764ba2;
        }
        
        .city-section-title.guangzhou .city-count {
            background: #764ba2;
        }
        
        .event-card {
            background: white;
            border: 1px solid #e6eaf2;
            border-radius: 15px;
            padding: 21px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(31, 43, 74, 0.05);
            position: relative;
        }
        
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        
        .event-card .city-tag {
            position: absolute;
            top: -10px;
            right: 20px;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            color: white;
        }
        
        .city-tag.shenzhen-tag {
            background: linear-gradient(135deg, #667eea, #4f5bd5);
        }
        
        .city-tag.guangzhou-tag {
            background: linear-gradient(135deg, #764ba2, #9b59b6);
        }
        
        .event-title {
            font-size: 17px;
            color: #172033;
            margin-bottom: 15px;
            font-weight: 600;
            padding-right: 80px;
        }
        
        .event-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .info-icon {
            color: #667eea;
            font-size: 1.2em;
            min-width: 24px;
        }
        
        .info-content {
            flex: 1;
        }
        
        .info-label {
            font-weight: 600;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 2px;
        }
        
        .info-value {
            color: #333;
            font-size: 1em;
        }
        
        .event-highlights {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 5px;
            margin-top: 15px;
        }
        
        .event-highlights h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .event-highlights ul {
            list-style: none;
            padding-left: 0;
        }
        
        .event-highlights li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
        }
        
        .event-highlights li:before {
            content: "\25B8";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }
        
        .registration-info {
            background: linear-gradient(135deg, #4f63e9 0%, #7d48c9 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .registration-info h4 {
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .registration-info a {
            color: white;
            text-decoration: underline;
        }
        
        .no-events {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .no-events-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .footer {
            background: #f8f9fa;
            padding: 30px;
            text-align: center;
            color: #666;
            border-top: 2px solid #e9ecef;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .events-container {
                padding: 20px;
            }
            
            .event-card {
                padding: 20px;
            }
            
            .event-card .city-tag {
                position: static;
                display: inline-block;
                margin-bottom: 10px;
            }
            
            .event-title {
                padding-right: 0;
            }
        }

        body.embedded {
            padding-top: 10px;
        }

        body.embedded .container {
            max-width: 1120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">🚀 深广 AI × 跨境电商活动指南</h1>
            <p>未来一个月线下及线上活动｜深圳优先｜面向 OPC 跨境创业者</p>
        </div>
        
        <div class="update-time">
            <strong>更新时间：</strong><span id="updateTime">加载中...</span>
            <span style="float: right;">共 <strong id="eventCount">0</strong> 个活动</span>
        </div>
        
        <div class="events-container" id="eventsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>正在加载活动信息...</p>
            </div>
        </div>
        
        <div class="footer">
            <p>📡 数据来源：主办方官网、协会/园区官方渠道及主流活动平台；只收录已核验的线下与线上活动</p>
            <p>🔄 每日 08:00 自动更新 | 最后更新：<span id="lastUpdate">-</span></p>
            <p>⚠️ 活动时间、地点与报名状态可能临时调整，请以主办方最新通知为准</p>
        </div>
    </div>

    <script>
        // DAILY_EVENTS_START — 每日自动任务只更新这个数据对象。
        const currentEvents = {
            "update_time": "2026-09-28T08:15:16+08:00",
            "range_label": "2026年9月28日—10月28日",
            "cities": {
                        "shenzhen": {
                                    "name": "深圳市",
                                    "flag": "🏙️",
                                    "events": [
                                                {
                                                            "title": "鹏城集慧，智赴未来——2026中国（深圳）·中东·东北亚经贸交流活动",
                                                            "date": "2026年9月29日（周二）14:00—17:30",
                                                            "location": "深圳市福田区河套科创中心D栋1楼会议室",
                                                            "highlights": [
                                                                        "深圳市商务局与河套深港科技创新合作区深圳园区发展署联合主办",
                                                                        "中东与韩国代表分享产业和投资政策，议程涵盖海外财税与合规经验",
                                                                        "深圳 OPC 跨境创业者可据此评估中东或韩国市场准入成本并对接当地资源"
                                                            ],
                                                            "registration": "深圳市商务局通知开放二维码申请参会；票价、审核条件及剩余名额未公布，请以官方通知附件为准；邀约对象为在深相关企业、商协会，个人 OPC 资格需确认；未公布报名截止。",
                                                            "source_url": "https://commerce.sz.gov.cn/ztzl/zcq/zxfw/hdxx/content/post_12988151.html",
                                                            "priority": true
                                                },
                                                {
                                                            "title": "AWS 软件企业峰会暨 Marketplace 用户大会｜AI 软件出海",
                                                            "date": "2026年10月13—14日；首日09:30起，具体场次见官方议程",
                                                            "location": "深圳蛇口希尔顿南海酒店",
                                                            "highlights": [
                                                                        "亚马逊云科技主办，讨论 Agentic AI 产品创新与全球商业化",
                                                                        "Marketplace 卖家、采购者对接；适合深圳 OPC 验证海外企业需求和渠道合作",
                                                                        "现场 Startup 路演另需入选；参加大会不保证融资、上架或成交"
                                                            ],
                                                            "registration": "官方报名表开放，可选 Entrepreneur / Co-Founder 等身份；需填写公司名和工作邮箱。费用、报名截止和个人参会资格未公布，提交前核对；报名页有验证步骤。",
                                                            "source_url": "https://aws.amazon.com/cn/campaigns/isv-marketplace-conference/",
                                                            "priority": true
                                                }
                                    ]
                        },
                        "guangzhou": {
                                    "name": "广州市",
                                    "flag": "🏙️",
                                    "events": [
                                                {
                                                            "title": "第140届广交会｜第一期与第二期产业对接",
                                                            "date": "第一期10月15—19日；第二期10月23—27日（第三期不在本轮范围）",
                                                            "location": "广州中国进出口商品交易会展馆；亦可使用官方线上贸易配对",
                                                            "highlights": [
                                                                        "商务部确认两期日程；适合 AI 硬件、供应链工具与跨境卖家调研供应商",
                                                                        "深圳 OPC 可先通过官网找产品、发布采购需求，再决定线下参加；现场对接不承诺融资或订单",
                                                                        "第一期重点先进制造与服务机器人，第二期品质家居；可先在线匹配供应商，境内办证须走专用系统。"
                                                            ],
                                                            "registration": "官方采购商指南与境内办证系统入口可访问；境内采购商需最新邀请码、审核通过并成功办理证件，线上账号不等于线下入场资格。费用和本届办理截止未核实，个人不能默认入场。",
                                                            "source_url": "https://www.cantonfair.org.cn/en-US/buyerguide",
                                                            "priority": false
                                                }
                                    ]
                        },
                        "online": {
                                    "name": "线上｜AI 出海与增长",
                                    "flag": "🌐",
                                    "events": [
                                                {
                                                            "title": "All Day AI｜SHIP：AI 产品设计与 GTM",
                                                            "date": "2026年10月22日 18:00 起（北京时间；SHIP 场次见官网议程）",
                                                            "location": "全球线上，英语活动",
                                                            "highlights": [
                                                                        "免费线上大会的 SHIP 轨道讨论产品交付与商业化",
                                                                        "适合深圳 OPC 出海团队完善产品定位与市场进入思路；非平台招商、融资承诺"
                                                            ],
                                                            "registration": "官网注册开放，免费；未公布报名截止时间。",
                                                            "source_url": "https://www.alldayai.com/",
                                                            "priority": true
                                                }
                                    ]
                        }
            }
};
        // DAILY_EVENTS_END

        function displayCurrentEvents(data) {
            const container = document.getElementById('eventsContainer');
            const updateDate = new Date(data.update_time);
            document.getElementById('updateTime').textContent = `${data.update_time.slice(0,16).replace('T',' ') + '（Asia/Shanghai）'}｜覆盖 ${data.range_label}`;
            document.getElementById('lastUpdate').textContent = data.update_time.slice(0,16).replace('T',' ') + '（Asia/Shanghai）';
            document.title = `深广 AI × 跨境电商活动指南（${data.range_label}）`;

            let total = 0;
            let html = '';
            for (const cityKey of ['shenzhen', 'guangzhou', 'online']) {
                const city = data.cities[cityKey];
                if (!city || !city.events.length) continue;
                const color = cityKey === 'shenzhen' ? 'shenzhen' : 'guangzhou';
                const tagClass = `${color}-tag`;
                html += `<div class="city-section"><div class="city-section-title ${color}"><span class="city-flag">${city.flag}</span><span class="city-name">${city.name}</span><span class="city-count">${city.events.length}场活动</span></div>`;
                for (const event of city.events) {
                    total++;
                    const badge = event.priority ? '<span style="background:#ff6b6b;color:white;padding:2px 8px;border-radius:8px;font-size:0.7em;margin-left:8px;">优先关注</span>' : '';
                    html += `<div class="event-card"><span class="city-tag ${tagClass}">📍 ${cityKey === 'shenzhen' ? '深圳' : cityKey === 'guangzhou' ? '广州' : '线上'}</span><div class="event-title">${event.title}${badge}</div><div class="event-info"><div class="info-item"><span class="info-icon">📅</span><div class="info-content"><div class="info-label">活动时间</div><div class="info-value">${event.date}</div></div></div><div class="info-item"><span class="info-icon">📍</span><div class="info-content"><div class="info-label">活动地点</div><div class="info-value">${event.location}</div></div></div></div><div class="event-highlights"><h4>💡 活动亮点</h4><ul>${event.highlights.map(item => `<li>${item}</li>`).join('')}</ul></div><div class="registration-info"><h4>🎫 报名方式</h4><p>${event.registration}</p><p style="margin-top:10px;"><a href="${event.source_url}" target="_blank" rel="noopener noreferrer">查看详情与报名 →</a></p></div></div>`;
                }
                html += '</div>';
            }
            if (!total) {
                html = '<div class="no-events"><div class="no-events-icon">📅</div><h3>暂未发现可靠活动</h3><p>未来一个月内暂未核验到深圳或广州的高相关线下活动。</p></div>';
            }
            document.getElementById('eventCount').textContent = total;
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (new URLSearchParams(location.search).has('embedded')) document.body.classList.add('embedded');
            displayCurrentEvents(currentEvents);
        });
    </script>
</body>
</html>
